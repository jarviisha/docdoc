# The four-process topology, runnable with no cloud credentials (FR-076).
#
#   docker compose -f packaging/docker/compose.yml up -d
#   docker compose -f packaging/docker/compose.yml run --rm api docdoc migrate
#
# Two commands. There is no Makefile and no task runner: this repository has
# neither, and quickstart.md names both lines.
#
# Constitution v1.6.0 admits `worker` to this composition. The sentence used to
# read "only api, postgres, and object storage", which excluded a process type
# Principle XI's own "API → queue → workers" requires — the document forbade
# demonstrating an evolution it mandated.
#
# Nothing here is a production deployment. There is no TLS, the object store
# holds a well-known key pair, and Postgres trusts a password in plaintext.

name: docdoc

services:
  api:
    build: &docdoc_build
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      args:
        # The image parses nothing without one of these, and the default omits
        # the local one on purpose: PyMuPDF is AGPL-3.0 (ADR-0001). For a local
        # walk-through, add `pdf` — knowingly, which is what setting it here is:
        #
        #   DOCDOC_EXTRAS=api,postgres,s3,google,azure,gcv,pdf \
        #     docker compose -f packaging/docker/compose.yml up -d --build
        #
        # For a real deployment, supply Azure Document Intelligence or Google
        # Cloud Vision credentials instead and leave this alone.
        DOCDOC_EXTRAS: ${DOCDOC_EXTRAS:-api,postgres,s3,google,azure,gcv}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["8000:8000"]
    # **So a container can reach a service on the host**, which two of this
    # milestone's capabilities need in development: a webhook receiver and an
    # OTLP collector, both of which the operator runs and neither of which the
    # composition adds (FR-023, FR-116).
    #
    # Docker Desktop resolves `host.docker.internal` on its own; **plain Docker on
    # Linux does not**, and this repository's CI and most contributors are Linux.
    # `quickstart.md` told the reader to point a callback and an exporter at that
    # name, and inside these containers it failed with `Name or service not
    # known` — a scenario that could not work as written, on the platform it was
    # written for. Verified by resolving it in the container, before and after.
    extra_hosts: &docdoc_hosts
      - "host.docker.internal:host-gateway"
    environment: &docdoc_env
      DOCDOC_RUN_DATABASE_URL: postgresql://docdoc:docdoc@postgres:5432/docdoc
      DOCDOC_STORE_URL: s3://docdoc?endpoint_url=http://minio:9000
      AWS_ACCESS_KEY_ID: docdoc
      AWS_SECRET_ACCESS_KEY: docdocdocdoc
      AWS_DEFAULT_REGION: us-east-1
      # Mounted below. The registry is empty without this and every extraction
      # is refused, which is the correct behaviour and a confusing first run.
      DOCDOC_SCHEMA_PATHS: /schemas
      # Offline by default: the composition comes up and runs documents with no
      # provider account. Swap to `gemini` and supply GEMINI_API_KEY for real
      # extraction. `echo` is never selected automatically by docdoc itself —
      # naming it here is an explicit local choice, not a fallback.
      DOCDOC_MODEL_ADAPTERS: ${DOCDOC_MODEL_ADAPTERS:-echo}
      DOCDOC_ECHO_FIXTURES: /fixtures

      # **Every credential the image can use, forwarded.** FR-077 permits one
      # manual step beyond a schema path — supplying a provider credential — and
      # a variable the containers never see is not a step an operator can take.
      #
      # The parser credentials are the ones that matter here and the ones that
      # were missing. `echo` replaces the *model*, not the parse, and the image
      # ships no local parser because PyMuPDF is AGPL-3.0 (ADR-0001) — so on a
      # default build a cloud parser credential is the only route to a working
      # deployment. Without these lines, exporting one did nothing: the
      # composition came up, reported healthy, and refused every document with
      # `ParserCapabilityError`.
      #
      # Empty by default so the composition still starts with none of them set.
      # An unavailable parser is a parser docdoc reports as unavailable, which is
      # the correct behaviour for a deployment that configured no parser at all.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DOCDOC_GEMINI_MODEL: ${DOCDOC_GEMINI_MODEL:-}
      DOCDOC_AZURE_DI_ENDPOINT: ${DOCDOC_AZURE_DI_ENDPOINT:-}
      DOCDOC_AZURE_DI_KEY: ${DOCDOC_AZURE_DI_KEY:-}
      # Google Cloud Vision reads a **file**, not a value, so the variable alone
      # is not enough — the file has to be inside the container. Mount it and
      # point this at the mount path:
      #
      #   DOCDOC_GCV_CREDENTIALS=/run/secrets/gcv.json \
      #     docker compose -f packaging/docker/compose.yml up -d
      #
      # with `- /path/on/host/gcv.json:/run/secrets/gcv.json:ro` added to the
      # volumes below. Said here rather than left to be discovered, because a
      # path that resolves on the host and not in the container is the failure
      # that reads as a credential problem and is not one.
      DOCDOC_GCV_CREDENTIALS: ${DOCDOC_GCV_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # Authentication is off by default here, exactly as it is off by default in
      # docdoc (FR-088). Point this at a key file to turn it on.
      DOCDOC_API_KEYS_FILE: ${DOCDOC_API_KEYS_FILE:-}
      # Which tenant owns the unprefixed store root. **Forwarded because it must
      # be the same in every process**: `docdoc.artifacts.paths` reads it in the
      # api, in every worker, and in `docdoc migrate`, and it describes the
      # store's layout rather than one invocation's behaviour.
      #
      # It was absent, and running this composition is what found that. `docdoc
      # migrate` records the answer in `docdoc_default_tenant` and refuses on a
      # later disagreement -- so a deployment upgrading a store that already held
      # pre-tenant content could be told, correctly, that it disagreed with
      # itself, and had no way to say otherwise from here.
      DOCDOC_DEFAULT_TENANT: ${DOCDOC_DEFAULT_TENANT:-}
      # --- Milestone 10, and every one of them is unset on purpose -------------
      #
      # Each capability is off by default (FR-101): a Milestone 9 deployment that
      # changes nothing here observes no behavioural difference at all -- nothing
      # swept, counted, refused, exported, routed, or delivered (SC-002). That is
      # the claim this composition is the first place to check.
      #
      # NO FIFTH SERVICE is added below for any of this. The composition still
      # contains api, worker, postgres, and object storage, which is what the
      # constitution's scope constraint permits and what SC-025 asserts. The OTLP
      # collector, if you run one, is yours.
      DOCDOC_RUN_RETENTION_DAYS: ${DOCDOC_RUN_RETENTION_DAYS:-}
      DOCDOC_RUN_SWEEP_BATCH: ${DOCDOC_RUN_SWEEP_BATCH:-}
      DOCDOC_RUN_CREDENTIAL_TTL_SECONDS: ${DOCDOC_RUN_CREDENTIAL_TTL_SECONDS:-}
      DOCDOC_LIMIT_SUBMISSIONS_PER_MINUTE: ${DOCDOC_LIMIT_SUBMISSIONS_PER_MINUTE:-}
      DOCDOC_LIMIT_CONCURRENT_RUNS: ${DOCDOC_LIMIT_CONCURRENT_RUNS:-}
      DOCDOC_LIMIT_RUNS_PER_PERIOD: ${DOCDOC_LIMIT_RUNS_PER_PERIOD:-}
      DOCDOC_LIMIT_TOKENS_PER_PERIOD: ${DOCDOC_LIMIT_TOKENS_PER_PERIOD:-}
      DOCDOC_PRIORITY_CEILING: ${DOCDOC_PRIORITY_CEILING:-}
      DOCDOC_RUN_STARVATION_SECONDS: ${DOCDOC_RUN_STARVATION_SECONDS:-}
      DOCDOC_DELIVERY_MAX_ATTEMPTS: ${DOCDOC_DELIVERY_MAX_ATTEMPTS:-}
      DOCDOC_DELIVERY_TIMEOUT_SECONDS: ${DOCDOC_DELIVERY_TIMEOUT_SECONDS:-}
      DOCDOC_DELIVERY_BACKOFF_SECONDS: ${DOCDOC_DELIVERY_BACKOFF_SECONDS:-}
      DOCDOC_DELIVERY_ALLOW_PRIVATE: ${DOCDOC_DELIVERY_ALLOW_PRIVATE:-}
      # Unset means this deployment delivers nothing, and that is the whole of
      # FR-064: every delivery is signed, so with nothing to sign with there is
      # no deliverer, no due query, and no socket (T112a).
      DOCDOC_DELIVERY_SECRETS_FILE: ${DOCDOC_DELIVERY_SECRETS_FILE:-}
      DOCDOC_LIMITS_FILE: ${DOCDOC_LIMITS_FILE:-}
      DOCDOC_ROUTING_POLICY: ${DOCDOC_ROUTING_POLICY:-}
      DOCDOC_CORRECTION_RETENTION_DAYS: ${DOCDOC_CORRECTION_RETENTION_DAYS:-}
      DOCDOC_MAINTENANCE_INTERVAL_SECONDS: ${DOCDOC_MAINTENANCE_INTERVAL_SECONDS:-}
      DOCDOC_MAINTENANCE_BUDGET_MS: ${DOCDOC_MAINTENANCE_BUDGET_MS:-}
      DOCDOC_MAINTENANCE_DELIVERY_BATCH: ${DOCDOC_MAINTENANCE_DELIVERY_BATCH:-}
      DOCDOC_OTLP_ENDPOINT: ${DOCDOC_OTLP_ENDPOINT:-}
      DOCDOC_OTLP_HEADERS: ${DOCDOC_OTLP_HEADERS:-}
    volumes: &docdoc_mounts
      - ../../schemas:/schemas:ro
      - ../../tests/fixtures/echo:/fixtures:ro
      # **Where an operator's own files go**: a key file, webhook signing
      # secrets, a routing policy. Read-only, gitignored, and empty until
      # somebody puts something in it — see `secrets/README.md`.
      #
      # Added because there was no way to get one in. Three quickstart scenarios
      # need an operator-supplied file, and the documented alternative --
      # `docker cp` then `docker compose up -d` -- **cannot work**: changing an
      # environment variable recreates the container and takes the copied file
      # with it, after which the API refuses to start on an unreadable key file.
      # That was found by following the instructions.
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # `docker compose up --scale worker=3` is how concurrency is configured.
  # A worker executes exactly one run at a time and there is no --concurrency
  # flag, because a threaded worker can starve a heartbeat until a live run
  # loses its lease — a utilisation choice becoming a correctness bug
  # (FR-025, research R9a).
  worker:
    build: *docdoc_build
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    # `--health-port` is what makes the orchestrator's configuration one
    # configuration rather than two (FR-053, FR-054): the worker answers the same
    # `/healthz` and `/readyz`, with the same bodies, on the same port number the
    # API uses. No port is published — replicas are scaled and a published port
    # cannot be — so this is reachable on the compose network, which is where a
    # probe comes from.
    command: ["docdoc", "worker", "--health-port", "8000"]
    # The worker needs it more than the API does: it is the process that attempts
    # deliveries and the one whose `run.transition` spans an operator most wants.
    extra_hosts: *docdoc_hosts
    environment: *docdoc_env
    volumes: *docdoc_mounts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docdoc
      POSTGRES_PASSWORD: docdoc
      POSTGRES_DB: docdoc
    # Published so the suite can reach it from the host. `api` and `worker` use
    # the service name and would not need this; the `postgres`-marked tests run
    # outside the composition and do, and CONTRIBUTING.md tells a contributor to
    # point DOCDOC_TEST_DATABASE_URL at localhost.
    #
    # Overridable because 5432 is the port a developer already running Postgres
    # has taken, and a compose file that refuses to start on their machine is one
    # they will edit and never commit. `DOCDOC_PG_PORT=55432 docker compose up`.
    ports: ["${DOCDOC_PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docdoc -d docdoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO stands in for S3 so the S3 code path is exercised locally with no cloud
  # account. Production points DOCDOC_STORE_URL at S3, R2, GCS, or a self-hosted
  # MinIO; S3ArtifactStore does not know the difference.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docdoc
      MINIO_ROOT_PASSWORD: docdocdocdoc
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket the store writes to, then exits. Compose has no
  # way to declare "this bucket must exist", and a first run that fails on a
  # missing bucket reads as a docdoc bug rather than a setup step.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 docdoc docdocdocdoc &&
             mc mb --ignore-existing local/docdoc"

volumes:
  pgdata:
  miniodata:
