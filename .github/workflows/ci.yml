name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # SC-005 claims the native path produces byte-identical documents across
    # platforms. A single-OS matrix cannot verify that claim, so it runs on all
    # three -- the geometry normalization and text assembly are float arithmetic
    # and string handling, which is exactly where a platform difference would
    # hide.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Kernel invariants gate everything (Constitution Quality Gate 2).
      # No credentials are configured here, so the provider-marked tests skip
      # themselves and the rest of the suite must still be meaningful (SC-009).
      - name: Unit, property, and contract tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest tests/unit tests/property tests/contract -m "not perf"

      - name: Type check (strict)
        run: uv run mypy src/docdoc

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Constitution Principle X — layer discipline is machine-checked, not conventional.
      - name: Import boundaries
        run: uv run lint-imports

  # The base install must stay usable with no provider SDK at all (SC-010).
  # Verified separately because the job above installs every extra.
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the base package only
        run: uv pip install --system .

      - name: The kernel imports with pydantic alone
        run: python -c "import docdoc.kernel, docdoc.ingest"

      - name: No provider SDK came with it
        run: |
          if python -c "import pymupdf" 2>/dev/null; then
            echo "pymupdf is installed by the base package; it must be an extra" >&2
            exit 1
          fi
          if python -c "import azure.ai.documentintelligence" 2>/dev/null; then
            echo "the azure SDK is installed by the base package; it must be an extra" >&2
            exit 1
          fi
