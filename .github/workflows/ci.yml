name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # SC-005 claims the native path produces byte-identical documents across
    # platforms. A single-OS matrix cannot verify that claim, so it runs on all
    # three -- the geometry normalization and text assembly are float arithmetic
    # and string handling, which is exactly where a platform difference would
    # hide.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Kernel invariants gate everything (Constitution Quality Gate 2).
      # No credentials are configured here, so the provider-marked tests skip
      # themselves and the rest of the suite must still be meaningful (SC-009).
      - name: Unit, property, and contract tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest tests/unit tests/property tests/contract tests/integration -m "not perf"

      # Milestone 4 (FR-028, research.md R14). PYTHONHASHSEED randomises string
      # hashing per process, so a set iterated directly yields a different order
      # each run. Grounding's *winner* is immune by construction -- the tie-break
      # is a total ordering -- but its `alternatives` list is not, and a
      # single-seeded suite passes a non-deterministic alternatives list by luck.
      # Running a second seed is what makes "identical on every run and every
      # platform" a checked claim rather than a hopeful one.
      # Milestone 6 extends this rather than adding a second job. Its reports must
      # be byte-identical for fixed inputs (FR-043), and the hazard is the same
      # one: a dict or set iterated to produce order passes under one seed by
      # luck. `report_determinism` also spawns both seeds itself, so this is the
      # belt to that file's braces -- and it covers `report_identity_sensitivity`,
      # which does not.
      #
      # Selected by term rather than by file path, deliberately: a path list goes
      # stale exactly when a new file makes it matter, which is the failure
      # `tests/unit/test_plan_tree_is_current.py` exists to end.
      - name: Grounding and evaluation determinism under a second hash seed
        env:
          HYPOTHESIS_PROFILE: ci
          PYTHONHASHSEED: "12345"
        run: uv run pytest tests/unit tests/property -k "grounding or tiebreak or offset or candidates or match_view or fuzzy or exact_tier or repeating_group or report_determinism or report_identity or ordering" -m "not perf"

      - name: Type check (strict)
        run: uv run mypy src/docdoc

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Constitution Principle X — layer discipline is machine-checked, not conventional.
      - name: Import boundaries
        run: uv run lint-imports

  # SC-021 is a success criterion, and plan.md says it is "enforced by" the perf
  # suite. It was not: the job above deselects `perf` and nothing else ran it, so
  # the claim was enforcement by nobody.
  #
  # This job blocks, deliberately. Non-blocking would be "not enforced" with extra
  # steps.
  #
  # The headroom is not uniform, and pretending it is would repeat the mistake this
  # job exists to correct:
  #
  #   - The extraction budgets have ~500x headroom (0.19 ms measured against 100 ms)
  #     and its two shape assertions are *ratios* — per-call cost inside a batch, and
  #     linearity in field count and repeating-group length — so they do not move
  #     with machine speed at all. These are safe to block on anywhere.
  #   - The kernel budgets are wall-clock and tight. A whole-document slice measures
  #     279 ms best-of-5 against a 300 ms budget: 1.07x. That may well be red on a
  #     slower runner.
  #
  # If the kernel budgets go red here, the honest response is to re-measure them on
  # a runner and raise them with the new figure recorded — they were Milestone 1
  # estimates, and 300 ms was never validated against CI hardware. Raising a budget
  # because a *number* moved is different from raising one because a *machine* is
  # slower, and only the second is legitimate.
  #
  # What is not legitimate is adding continue-on-error, which would restore exactly
  # the situation this job was added to fix. Running the suite at all already found
  # three kernel tests that had been red or coin-flipping unnoticed.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Performance budgets
        run: uv run pytest -m perf -q

  # `[tool.coverage]` has been configured since Milestone 1, under a comment
  # citing SC-006, and nothing ever ran with `--cov`. A quality bar that is
  # configured but never measured is the same shape of defect as the `perf` job
  # above: enforcement by nobody.
  #
  # Two things this job deliberately does NOT do:
  #
  #   - It does not run `perf`. Coverage instrumentation slows execution enough
  #     to blow five wall-clock budgets (three kernel, two grounding) — measured,
  #     not assumed. Those budgets are the `perf` job's business and are timed
  #     without a tracer attached.
  #   - It does not run on the full matrix. Coverage is a property of the test
  #     suite, not of the platform, and paying the tracer's cost six times to
  #     learn the same number is waste.
  #
  # The threshold is 93 against a measured 95 (3894 statements, 154 missed),
  # stable at 95 under both the default and `ci` Hypothesis profiles. The two
  # points of slack are for branch-coverage wobble across generated examples;
  # they are not enough to hide an untested module, which is the regression this
  # catches. Raise it when the real number rises — a ratchet only works if it
  # turns.
  #
  # SC-006's actual claim is narrower and is met: `kernel/document.py`, which
  # holds `locate`, `find`, `slice`, and `merge`, has 199 statements and zero
  # missed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          uv run pytest tests/unit tests/property tests/contract tests/integration
          -m "not perf"
          --cov=docdoc --cov-report=term-missing --cov-fail-under=93

  # The base install must stay usable with no provider SDK at all (SC-010).
  # Verified separately because the job above installs every extra.
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Into a fresh environment, not the runner's system Python: that one is
      # externally managed (PEP 668) and refuses `--system`. A clean venv is also
      # a truer reproduction of what a user gets, since it starts with nothing.
      - name: Install the base package only
        run: |
          uv venv .venv-base
          uv pip install --python .venv-base .

      - name: The kernel, ingest, and extraction import with pydantic alone
        run: .venv-base/bin/python -c "import docdoc.kernel, docdoc.ingest, docdoc.extraction"

      - name: No provider SDK came with it
        run: |
          if .venv-base/bin/python -c "import pymupdf" 2>/dev/null; then
            echo "pymupdf is installed by the base package; it must be an extra" >&2
            exit 1
          fi
          if .venv-base/bin/python -c "import azure.ai.documentintelligence" 2>/dev/null; then
            echo "the azure SDK is installed by the base package; it must be an extra" >&2
            exit 1
          fi
          if .venv-base/bin/python -c "import google.genai" 2>/dev/null; then
            echo "the google-genai SDK is installed by the base package; it must be an extra" >&2
            exit 1
          fi

      # An absence check passes trivially if the import name is wrong, so prove
      # the same commands do detect a provider SDK when one is present.
      - name: The absence check can actually fail
        run: |
          uv pip install --python .venv-base pymupdf
          if .venv-base/bin/python -c "import pymupdf" 2>/dev/null; then
            echo "detection works"
          else
            echo "the check cannot see pymupdf even when installed; it proves nothing" >&2
            exit 1
          fi
