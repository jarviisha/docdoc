name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Kernel invariants gate everything (Constitution Quality Gate 2).
      - name: Unit and property tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest tests/unit tests/property -m "not perf"

      - name: Type check (strict, kernel)
        run: uv run mypy src/docdoc/kernel

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Constitution Principle X — layer discipline is machine-checked, not conventional.
      - name: Import boundaries
        run: uv run lint-imports
