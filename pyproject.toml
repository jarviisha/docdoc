[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docdoc"
version = "0.1.0"
description = "Provider-agnostic Intelligent Document Processing engine with source-grounded extraction"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

# Two base dependencies, and the distinction between them matters.
#
# The *kernel* imports `pydantic` alone — that is Constitution Principle I, and
# `tests/unit/test_kernel_purity.py` enforces it exhaustively and mechanically.
#
# The *base install* additionally carries `rapidfuzz`, which the grounding layer
# uses as a scorer for approximate matching. Sanctioned explicitly: the
# constitution's stack line names "`rapidfuzz` in the extraction layer for
# grounding", and ADR-0005 records that it "enters the base install for anyone
# using extraction. It is not a provider SDK and does not violate Principle IV".
# It is a small pure-wheel package with no transitive dependencies, and it is
# already in the kernel's forbidden-imports contract below.
dependencies = ["pydantic>=2.0", "rapidfuzz>=3.0"]

[project.optional-dependencies]
# Provider extras. The base install stays `pydantic` alone (Constitution
# Principle IV: "the base install MUST NOT force installation of any provider
# SDK or OCR engine").
#
# NOTE ON LICENSING: PyMuPDF is AGPL-3.0 (or a paid commercial licence), while
# docdoc is Apache-2.0. Keeping it behind an opt-in extra means docdoc's own
# distribution stays Apache-2.0 and the AGPL obligation is incurred only by a
# user who installs `docdoc[pdf]`. See specs/002-ingest-parser-layer/research.md R1.
pdf = ["pymupdf>=1.24"]
azure = ["azure-ai-documentintelligence>=1.0"]
# The one LLM adapter of the MVP (specs/003 research.md R1). The unified
# `google-genai` SDK, not the legacy `google-generativeai`. Apache-2.0, so no
# licence caveat like the pdf extra's.
google = ["google-genai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docdoc"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown is prose and design history, not source. Formatting Python snippets
# inside it rewrites documents that are meant to be quoted verbatim.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TCH", "RUF"]
ignore = [
    "A003", # attribute shadowing a builtin: Document.slice / Document.find are the spec'd names
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime when building a model, so these
# imports must NOT be moved into a TYPE_CHECKING block. Same for NamedTuple.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.NamedTuple"]

[tool.ruff.lint.per-file-ignores]
# Grounding's whole job is telling a ligature from "fi", a NBSP from a space, and
# U+2010 from a hyphen-minus. RUF001 flags exactly those characters as "ambiguous",
# which is correct everywhere else and backwards here: the ambiguity is the subject
# matter, and the fixtures would be meaningless written any other way.
"src/docdoc/grounding/view.py" = ["RUF001"]
"tests/fixtures/grounding/__init__.py" = ["RUF001"]
"tests/unit/test_match_view.py" = ["RUF001"]
"tests/unit/test_dehyphenation.py" = ["RUF001"]
"tests/property/test_offset_map_properties.py" = ["RUF001", "RUF002"]
"examples/ground_invoice.py" = ["RUF001"]
"tests/*" = [
    "S101",   # asserts are the point of a test
    "TC001",  # test helpers use these types at runtime via fixtures
    "TC002",
    "TC003",
]

# ---------------------------------------------------------------------------
# mypy — strict for the kernel, whose types are its contract
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# PyMuPDF's public functions carry no annotations, so --strict's no-untyped-call
# rule fires on every library call. Relaxing exactly that one rule, in exactly
# the module whose job is to talk to that library, keeps everything else strict.
# This is the practical reason adapters exist: the untyped world stops here
# (Principle IV).
[[tool.mypy.overrides]]
module = "docdoc.ingest.parsers.pdf_text"
disallow_untyped_calls = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "perf: performance benchmarks (deselect with -m 'not perf')",
    # Live provider calls. These need credentials and network; the unit,
    # property, and contract suites must pass without them (Principle XII).
    "provider: live document-intelligence service tests (select with -m provider)",
]

# ---------------------------------------------------------------------------
# Coverage — SC-006 requires 100% statement coverage of the four core operations
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/docdoc"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# import-linter — Constitution Principle X, machine-checked layer direction
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "docdoc"
# Required because the forbidden contract below names third-party packages.
include_external_packages = true

# The constitution's full order is:
#   api > pipeline > extraction > transform > ingest > kernel
# `kernel` landed at Milestone 1, `ingest` at Milestone 2, and `extraction` at
# Milestone 3. import-linter errors on layers that name non-existent modules, so
# higher layers are added to this list as their milestones land. The kernel's own
# dependency allowlist is enforced independently and exhaustively by
# tests/unit/test_kernel_purity.py.
#
# `grounding` (Milestone 4) sits ABOVE `extraction`: it consumes an
# ExtractionResult, so the dependency runs one way and this contract is what
# makes that mechanical rather than conventional. Principle X's chain does not
# name grounding; ADR-0003's stage chain does, unambiguously
# (parse -> extraction -> grounding -> validation), and is finer-grained and
# consistent with it. See specs/004-deterministic-grounding/research.md R1.
#
# `validation` (Milestone 5) continues the same reading, one layer higher: it
# consumes a GroundingResult and an ExtractionResult and produces the verdict.
# See specs/005-deterministic-validation/research.md R1.
[[tool.importlinter.contracts]]
name = "docdoc layers (Constitution Principle X)"
type = "layers"
layers = [
    "docdoc.validation",
    "docdoc.grounding",
    "docdoc.extraction",
    "docdoc.ingest",
    "docdoc.kernel",
]

# Grounding is deterministic all the way down: no network, no credentials, no
# provider, and no model call under any circumstance (FR-048). That is this
# milestone's headline property and the reason its entire test suite runs for
# every contributor with nothing to skip. Asserted here so that adding an import
# which would quietly break it fails the build instead of waiting for a reviewer.
[[tool.importlinter.contracts]]
name = "grounding reaches no network and no provider (FR-048)"
type = "forbidden"
source_modules = ["docdoc.grounding"]
forbidden_modules = [
    "socket",
    "urllib",
    "http",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "google",
    "boto3",
    "azure",
    "fastapi",
    "sqlalchemy",
]

# Validation is deterministic all the way down, for the same reason grounding is
# and with one addition: this stage decides whether a document is acceptable, so
# a verdict that could depend on a network call is a verdict nobody can
# reproduce (FR-007). Asserted here so an import that would quietly break it
# fails the build rather than waiting for a reviewer.
[[tool.importlinter.contracts]]
name = "validation reaches no network and no provider (FR-007)"
type = "forbidden"
source_modules = ["docdoc.validation"]
forbidden_modules = [
    "socket",
    "urllib",
    "http",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "google",
    "boto3",
    "azure",
    "fastapi",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "kernel is independent of provider SDKs and frameworks"
type = "forbidden"
source_modules = ["docdoc.kernel"]
forbidden_modules = [
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "boto3",
    "fastapi",
    "sqlalchemy",
    "pymupdf",
    "fitz",
    "rapidfuzz",
]

# Principle IV: provider SDK types must not appear outside an adapter. The
# adapters under docdoc.ingest.parsers are the only exception, declared here by
# name so that adding a third one is a visible, reviewed change.
[[tool.importlinter.contracts]]
name = "provider SDKs stay inside parser adapters (Constitution Principle IV)"
type = "forbidden"
source_modules = ["docdoc.ingest"]
forbidden_modules = [
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "boto3",
    "fastapi",
    "sqlalchemy",
    "pymupdf",
    "fitz",
    "azure",
]
ignore_imports = [
    "docdoc.ingest.parsers.pdf_text -> pymupdf",
    "docdoc.ingest.parsers.pdf_text -> fitz",
    "docdoc.ingest.parsers.azure_di -> azure",
    "docdoc.ingest.parsers.azure_di -> httpx",
]
# The adapters arrive task by task; an ignore naming a module that does not
# exist yet is expected, not a misconfiguration.
unmatched_ignore_imports_alerting = "none"

# The same rule for the extraction layer, whose only adapter directory is
# docdoc.extraction.adapters. Listed separately from the ingest contract so that
# neither layer can accidentally inherit the other's exemptions.
[[tool.importlinter.contracts]]
name = "provider SDKs stay inside model adapters (Constitution Principle IV)"
type = "forbidden"
source_modules = ["docdoc.extraction"]
forbidden_modules = [
    "google",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "boto3",
    "fastapi",
    "sqlalchemy",
    "pymupdf",
    "fitz",
    "azure",
]
ignore_imports = [
    "docdoc.extraction.adapters.gemini -> google",
]
unmatched_ignore_imports_alerting = "none"
