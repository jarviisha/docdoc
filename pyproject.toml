[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docdoc"
version = "0.1.0"
description = "Provider-agnostic Intelligent Document Processing engine with source-grounded extraction"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Typing :: Typed",
]

# Two base dependencies, and the distinction between them matters.
#
# The *kernel* imports `pydantic` alone — that is Constitution Principle I, and
# `tests/unit/test_kernel_purity.py` enforces it exhaustively and mechanically.
#
# The *base install* additionally carries `rapidfuzz`, which the grounding layer
# uses as a scorer for approximate matching. Sanctioned explicitly: the
# constitution's stack line names "`rapidfuzz` in the extraction layer for
# grounding", and ADR-0005 records that it "enters the base install for anyone
# using extraction. It is not a provider SDK and does not violate Principle IV".
# It is a small pure-wheel package with no transitive dependencies, and it is
# already in the kernel's forbidden-imports contract below.
dependencies = ["pydantic>=2.0", "rapidfuzz>=3.0"]

[project.optional-dependencies]
# Provider extras. The base install stays `pydantic` alone (Constitution
# Principle IV: "the base install MUST NOT force installation of any provider
# SDK or OCR engine").
#
# NOTE ON LICENSING: PyMuPDF is AGPL-3.0 (or a paid commercial licence), while
# docdoc is Apache-2.0. Keeping it behind an opt-in extra means docdoc's own
# distribution stays Apache-2.0 and the AGPL obligation is incurred only by a
# user who installs `docdoc[pdf]`. See specs/002-ingest-parser-layer/research.md R1.
pdf = ["pymupdf>=1.24"]
azure = ["azure-ai-documentintelligence>=1.0"]
# The one LLM adapter of the MVP (specs/003 research.md R1). The unified
# `google-genai` SDK, not the legacy `google-generativeai`. Apache-2.0, so no
# licence caveat like the pdf extra's.
google = ["google-genai>=1.0"]
# The image OCR recognition path. A separate extra from `google` despite the
# shared vendor: they are different SDKs serving different layers -- extraction
# and ingest -- and a deployment wanting one has no reason to install the other.
gcv = ["google-cloud-vision>=3.4"]
# The HTTP interface of Milestone 7, confined to `docdoc.api` and enforced there
# by the forbidden-imports contracts below, which name `fastapi` for every
# deterministic layer. An extra rather than a base dependency for the same reason
# every provider SDK is one: the base install is the deterministic layers and
# nothing else (FR-038, FR-053).
#
# There is deliberately no `cli` extra. The command line is argparse, so there is
# nothing to keep out of the base install, and `docdoc` is a console script every
# `pip install docdoc` gets (research R12).
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# The browser client of Milestone 8, as a *dependency* rather than as files.
#
# A Python extra can add a dependency but cannot add files to a wheel everyone
# already installs, so shipping the assets here would give them to every
# `pip install docdoc` -- which FR-035 forbids in as many words. Opting in has to
# be what delivers them, and that means a second distribution (research R7,
# ADR-0012's neighbour in `packaging/docdoc-ui/`).
#
# Pinned with `==` rather than a range: the assets and the routes that serve them
# are one artifact split for packaging reasons, not two things with a
# compatibility window. They move together or they disagree about what `/ui`
# means.
#
# NOTE ON LICENSING: unlike the `pdf` extra above, nothing here carries an
# obligation beyond Apache-2.0 -- every browser dependency is MIT or Apache-2.0,
# recorded with its licence in `ui/LICENSES.md` and checked by `npm run licenses`
# rather than asserted. That is not a coincidence: the renderer was chosen on
# licence before it was chosen on merit, because the server-side alternative
# would have made AGPL-3.0 a required path.
ui = ["docdoc-ui==0.1.0"]
# Run state for Milestone 9, and the only database this project has. An extra
# rather than a base dependency for the reason every extra here exists: the base
# install is the deterministic layers and nothing else (SC-013). A deployment
# that uses neither the run routes nor a worker needs no database at all, and the
# library and command line need none in any configuration.
#
# psycopg 3 rather than asyncpg because the deployment needs both shapes from one
# package: the worker is synchronous because `pipeline.run()` is, and the API is
# `async def` throughout. asyncpg would cover only the second (research R6).
#
# No ORM and no migration framework. There is one table, the queries are a
# handful of statements, and the claim query needs `FOR UPDATE SKIP LOCKED` --
# which an ORM obscures rather than helps. SQLAlchemy would be the largest
# dependency in the project, arriving to manage one table (research R6, R7).
postgres = ["psycopg[binary,pool]>=3.1"]
# Shared object storage, so that two workers can reuse each other's artifacts.
# Without it, each worker has a private `DOCDOC_STORE_ROOT` and scaling produces
# correct results while silently re-paying for every parse -- the failure mode
# SC-005 exists to catch.
#
# `boto3` is infrastructure the sanctioned stack names ("local filesystem or
# S3-compatible object storage"), not a document-processing provider SDK, so
# Principle IV's adapter-directory rule does not reach it. It is imported lazily
# inside `S3ArtifactStore.__init__` all the same, so a base install neither
# imports nor requires it (research R5).
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
]

# One console script, and only one. `docdoc` costs nothing because the CLI is
# argparse; a second script for the HTTP service would not be free, because
# `[project.scripts]` cannot be conditioned on an extra -- a `docdoc-api` command
# would install for everyone, including everyone without `docdoc[api]`, and fail
# at import. Serving is `uvicorn docdoc.api:app`.
[project.scripts]
docdoc = "docdoc.cli:main"

# `docdoc-ui` is built from this repository (`packaging/docdoc-ui/`) and is not
# on an index until a release publishes it. Without this, adding the `ui` extra
# above breaks `uv sync --all-extras` for every contributor — and it did, on the
# first run after the extra was declared.
#
# A development-time source only: the published `docdoc[ui]` still resolves
# `docdoc-ui==0.1.0` from the index, exactly as its dependency line says. uv
# ignores `[tool.uv.sources]` when building a distribution for that reason.
[tool.uv.sources]
docdoc-ui = { path = "packaging/docdoc-ui" }

[tool.hatch.build.targets.wheel]
packages = ["src/docdoc"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown is prose and design history, not source. Formatting Python snippets
# inside it rewrites documents that are meant to be quoted verbatim.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "TCH", "RUF"]
ignore = [
    "A003", # attribute shadowing a builtin: Document.slice / Document.find are the spec'd names
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime when building a model, so these
# imports must NOT be moved into a TYPE_CHECKING block. Same for NamedTuple.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.NamedTuple"]

[tool.ruff.lint.per-file-ignores]
# Grounding's whole job is telling a ligature from "fi", a NBSP from a space, and
# U+2010 from a hyphen-minus. RUF001 flags exactly those characters as "ambiguous",
# which is correct everywhere else and backwards here: the ambiguity is the subject
# matter, and the fixtures would be meaningless written any other way.
"src/docdoc/grounding/view.py" = ["RUF001"]
"tests/fixtures/grounding/__init__.py" = ["RUF001"]
"tests/unit/test_match_view.py" = ["RUF001"]
"tests/unit/test_dehyphenation.py" = ["RUF001"]
"tests/property/test_offset_map_properties.py" = ["RUF001", "RUF002"]
"examples/ground_invoice.py" = ["RUF001"]
"tests/*" = [
    "S101",   # asserts are the point of a test
    "TC001",  # test helpers use these types at runtime via fixtures
    "TC002",
    "TC003",
]

# ---------------------------------------------------------------------------
# mypy — strict for the kernel, whose types are its contract
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# PyMuPDF's public functions carry no annotations, so --strict's no-untyped-call
# rule fires on every library call. Relaxing exactly that one rule, in exactly
# the module whose job is to talk to that library, keeps everything else strict.
# This is the practical reason adapters exist: the untyped world stops here
# (Principle IV).
[[tool.mypy.overrides]]
module = "docdoc.ingest.parsers.pdf_text"
disallow_untyped_calls = false

# google-cloud-vision and its api_core/auth dependencies ship no py.typed marker,
# so every symbol imported from them is untyped. Same reasoning as the PyMuPDF
# override above and confined the same way: to the one module whose job is to
# talk to that library. Everything the adapter hands onward is annotated.
[[tool.mypy.overrides]]
module = "docdoc.ingest.parsers.gcv"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

# boto3 ships no py.typed marker, so the lazy import inside `S3ArtifactStore`'s
# constructor is an error under --strict. Same shape and same narrowness as the
# `google.*` override above: this suppresses the *missing stubs* for one third
# party, not any check on docdoc's own code. Everything `docdoc.artifacts.s3`
# hands onward is annotated, and the client itself is `Any` at the boundary
# exactly as the parser adapters' SDKs are.
#
# `boto3-stubs` was the alternative and is a large optional dependency added to
# type-check nine call sites, which is not a trade this project has made anywhere
# else.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "perf: performance benchmarks (deselect with -m 'not perf')",
    # Live provider calls. These need credentials and network; the unit,
    # property, and contract suites must pass without them (Principle XII).
    "provider: live document-intelligence service tests (select with -m provider)",
    # Milestone 9's infrastructure. These follow the `provider` pattern exactly:
    # the mark labels them, and each test *skips itself* when its dependency is
    # unconfigured, rather than being deselected by `addopts`. That is what keeps
    # `uv run pytest` honest for a contributor with neither a database nor a
    # bucket -- the suite runs, and says what it skipped (SC-013).
    "postgres: needs DOCDOC_TEST_DATABASE_URL (select with -m postgres)",
    "s3: needs DOCDOC_TEST_S3_ENDPOINT (select with -m s3)",
]

# ---------------------------------------------------------------------------
# Coverage — enforced by the `coverage` job in .github/workflows/ci.yml, which
# runs `--cov-fail-under=93` against a measured 95%. This section was configured
# at Milestone 1 and nothing ran with `--cov` until Milestone 6, so the bar it
# describes went unmeasured for five milestones.
#
# SC-006's claim is narrower than a global percentage: 100% *statement* coverage
# of the four core operations. Those live in `kernel/document.py`, which reports
# 199 statements and zero missed. The global threshold is a separate, weaker
# regression ratchet and should not be read as that claim.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/docdoc"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# import-linter — Constitution Principle X, machine-checked layer direction
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "docdoc"
# Required because the forbidden contract below names third-party packages.
include_external_packages = true

# The constitution's full order is:
#   api > pipeline > extraction > transform > ingest > kernel
# `kernel` landed at Milestone 1, `ingest` at Milestone 2, and `extraction` at
# Milestone 3. import-linter errors on layers that name non-existent modules, so
# higher layers are added to this list as their milestones land. The kernel's own
# dependency allowlist is enforced independently and exhaustively by
# tests/unit/test_kernel_purity.py.
#
# `grounding` (Milestone 4) sits ABOVE `extraction`: it consumes an
# ExtractionResult, so the dependency runs one way and this contract is what
# makes that mechanical rather than conventional. Principle X's chain does not
# name grounding; ADR-0003's stage chain does, unambiguously
# (parse -> extraction -> grounding -> validation), and is finer-grained and
# consistent with it. See specs/004-deterministic-grounding/research.md R1.
#
# `validation` (Milestone 5) continues the same reading, one layer higher: it
# consumes a GroundingResult and an ExtractionResult and produces the verdict.
# See specs/005-deterministic-validation/research.md R1.
#
# `evaluation` and `recording` (Milestone 6) are the first pair added at once, and
# the order between them is the point. `recording` runs the pipeline to produce a
# PredictionSet; `evaluation` scores one. The data flows one way, so the layers do
# too -- and that ordering is what makes `evaluation -> recording` a build failure
# rather than a sentence in a specification. FR-003 says recording MUST NOT be
# part of evaluation; inside one package that is a naming convention, and as two
# layers it is this contract.
#
# Constitution v1.4.0 states this chain in Principle X. Through Milestone 5 it did
# not: the principle named `Transform` and `Pipeline`, which have never existed,
# and omitted `grounding` and `validation`, which do. This list is the
# authoritative form because it is the one CI checks, and the constitution is now
# amended in the same change that adds a layer here.
#
# Milestone 7 adds four, and two of the positions are worth explaining because a
# reader would reasonably guess differently.
#
# `artifacts` sits directly ABOVE the kernel, which is the lowest position that is
# true: it depends on `pydantic`, two kernel hashing helpers, and -- since
# Milestone 9 -- `boto3`, lazily and behind the `s3` extra. It stores whole result
# models without importing a single one of them -- the caller names the model at
# the call site -- and that is what keeps it here instead of somewhere near the
# top next to the code it serves.
#
# The `boto3` clause is new and this comment used to end "and on nothing else".
# `S3ArtifactStore` lives here because it implements a protocol this layer
# defines, and separating the two would force one of them to import across a
# boundary. The import is inside the constructor, so a base install still
# acquires neither the dependency nor the import (research R5, SC-013).
#
# `pipeline` sits directly ABOVE `validation`, the highest stage it drives, rather
# than above `evaluation` where its milestone might suggest. Inserting it here
# leaves the `recording > evaluation` edge Milestone 6 argued for exactly as it
# was, and it gives `recording > pipeline`, which is what makes the recorder a
# CALLER of the pipeline rather than a second definition of the stage order.
#
# A total order forces `evaluation > pipeline` although evaluation imports nothing
# from it. That is an artefact of the contract type and is harmless; the
# alternative is a dozen pairwise `forbidden` contracts nobody will maintain.
#
# `api` and `cli` cannot be honestly ordered against each other -- neither should
# import the other -- so they share the top position here and are separated by the
# independence contract below.
[[tool.importlinter.contracts]]
name = "docdoc layers (Constitution Principle X)"
type = "layers"
#
# Milestone 9 adds `runs`, and it shares a position with `recording` rather than
# taking one of its own. It must sit below `api` and `cli` (both call it) and
# above `pipeline` (it calls that); between those, its only neighbour is
# `recording`, and the two share nothing. `recording` drives the pipeline to
# produce a prediction set; `runs` drives it to serve a request. An ordered
# position would grant a permission neither needs -- the same argument made for
# `api : cli` below -- so they are siblings, separated by an independence
# contract. See specs/009-asynchronous-runs/research.md R10.
#
# The total order then forces `runs > evaluation`, which `runs` does not import.
# That is the same harmless artefact already noted above for `evaluation >
# pipeline`, and preferable to a dozen pairwise contracts nobody will maintain.
layers = [
    "docdoc.api : docdoc.cli",
    "docdoc.recording : docdoc.runs",
    "docdoc.evaluation",
    "docdoc.pipeline",
    "docdoc.validation",
    "docdoc.grounding",
    "docdoc.extraction",
    "docdoc.ingest",
    "docdoc.artifacts",
    "docdoc.kernel",
]

# Siblings, not a stack. Sharing a layer position above says neither may import
# the other's *lower* neighbours wrongly; it does not say they may not import each
# other, and a position in a list would have implied a permission. The coupling
# this prevents is the tempting one: the HTTP layer reusing the CLI's renderer.
# They are two presentation layers with different audiences, and the thing they
# genuinely share is the result model both already import.
[[tool.importlinter.contracts]]
name = "the two front ends do not know about each other (FR-054)"
type = "independence"
modules = [
    "docdoc.api",
    "docdoc.cli",
]

# Siblings for the same reason, one layer down. `recording` produces a prediction
# set for evaluation; `runs` accepts a request and hands it to a worker. Neither
# has any business importing the other, and sharing a layer position does not say
# so on its own (specs/009 research R10, FR-070).
[[tool.importlinter.contracts]]
name = "recording and runs are siblings, not a stack (FR-070)"
type = "independence"
modules = [
    "docdoc.recording",
    "docdoc.runs",
]

# FR-044 has two halves and the layers contract only carries one of them.
#
# "The worker MUST NOT import the API layer" follows from position: `runs` is
# below `api`. "The API MUST NOT import the worker's execution loop" does NOT --
# `api` sits *above* `runs` and may therefore import anything in it, including
# `worker.py`. Without this contract that half of the requirement cannot fail,
# and a requirement that cannot fail is not a requirement. /speckit-analyze
# raised it on exactly that ground.
#
# The API needs the queue and the model; it never needs the loop. An API process
# that imported it would be one refactor away from executing runs in the request
# it was built to stop executing runs in.
[[tool.importlinter.contracts]]
name = "the API cannot reach the worker's execution loop (FR-044)"
type = "forbidden"
source_modules = ["docdoc.api"]
forbidden_modules = ["docdoc.runs.worker"]

# FR-026 is the only functional requirement in Milestone 9 that names technology,
# and it names it as a prohibition carried over from the constitution's
# deferred-technology list: no message broker, no coordinator, no scheduler
# process. The queue is a table claimed with `FOR UPDATE SKIP LOCKED`.
#
# Stated as a contract rather than left to review, because the constitution's
# rationale -- "most IDP projects fail ... by building distributed infrastructure
# before they have a correct document model" -- describes a pressure that arrives
# later, in a PR nobody reads as closely as this one. A prohibition with no
# automated guard is a comment.
[[tool.importlinter.contracts]]
name = "the run queue is a table, not a broker (FR-026)"
type = "forbidden"
source_modules = ["docdoc.runs"]
forbidden_modules = [
    "celery",
    "kombu",
    "redis",
    "kafka",
    "confluent_kafka",
    "temporalio",
    "rq",
    "dramatiq",
]

# Grounding is deterministic all the way down: no network, no credentials, no
# provider, and no model call under any circumstance (FR-048). That is this
# milestone's headline property and the reason its entire test suite runs for
# every contributor with nothing to skip. Asserted here so that adding an import
# which would quietly break it fails the build instead of waiting for a reviewer.
[[tool.importlinter.contracts]]
name = "grounding reaches no network and no provider (FR-048)"
type = "forbidden"
source_modules = ["docdoc.grounding"]
forbidden_modules = [
    "docdoc.artifacts",
    "socket",
    "urllib",
    "http",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "google",
    "boto3",
    "azure",
    "fastapi",
    "sqlalchemy",
]

# Validation is deterministic all the way down, for the same reason grounding is
# and with one addition: this stage decides whether a document is acceptable, so
# a verdict that could depend on a network call is a verdict nobody can
# reproduce (FR-007). Asserted here so an import that would quietly break it
# fails the build rather than waiting for a reviewer.
[[tool.importlinter.contracts]]
name = "validation reaches no network and no provider (FR-007)"
type = "forbidden"
source_modules = ["docdoc.validation"]
forbidden_modules = [
    "docdoc.artifacts",
    "socket",
    "urllib",
    "http",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "google",
    "boto3",
    "azure",
    "fastapi",
    "sqlalchemy",
]

# Evaluation is the layer the quality gates read, so a scorer that could reach a
# network is a metric nobody can reproduce (FR-007).
#
# This contract has teeth, and it drew blood on the first module that needed
# `ExtractionResult`. import-linter follows FUNCTION-SCOPED imports, so
# `from docdoc.extraction import ExtractionResult` pulls in the package's
# `__init__.py` -> `adapter_registry` -> `adapters.gemini` -> `google` and breaks
# this contract immediately.
#
# The rule every layer above extraction follows, and the reason grounding's and
# validation's contracts are green: import extraction's SUBMODULES, never the
# package. `docdoc.grounding` takes `docdoc.extraction.value`; `docdoc.validation`
# takes `docdoc.extraction.schema`, `.value`, `.errors`; `docdoc.evaluation` takes
# `docdoc.extraction.extract`. None of them execute `extraction/__init__.py`, so
# the adapter registry never enters their graph.
#
# Two other things carry FR-007 alongside this: the layers contract above, which
# forbids `evaluation -> recording`; and `tests/unit/test_scoring_is_offline.py`,
# which scores the committed public tier with `socket.socket` patched to raise --
# because a graph proves nothing about a module that assembles a URL by hand.
[[tool.importlinter.contracts]]
name = "evaluation reaches no network and no provider (FR-007)"
type = "forbidden"
source_modules = ["docdoc.evaluation"]
forbidden_modules = [
    "docdoc.artifacts",
    "socket",
    "urllib",
    "http",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "google",
    "boto3",
    "azure",
    "fastapi",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "kernel is independent of provider SDKs and frameworks"
type = "forbidden"
source_modules = ["docdoc.kernel"]
forbidden_modules = [
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "boto3",
    "fastapi",
    "sqlalchemy",
    "pymupdf",
    "fitz",
    "rapidfuzz",
]

# Principle IV: provider SDK types must not appear outside an adapter. The
# adapters under docdoc.ingest.parsers are the only exception, declared here by
# name so that adding a third one is a visible, reviewed change.
[[tool.importlinter.contracts]]
name = "provider SDKs stay inside parser adapters (Constitution Principle IV)"
type = "forbidden"
source_modules = ["docdoc.ingest"]
forbidden_modules = [
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "boto3",
    "fastapi",
    "sqlalchemy",
    "pymupdf",
    "fitz",
    "azure",
    "google",
]
ignore_imports = [
    "docdoc.ingest.parsers.pdf_text -> pymupdf",
    "docdoc.ingest.parsers.pdf_text -> fitz",
    "docdoc.ingest.parsers.azure_di -> azure",
    "docdoc.ingest.parsers.azure_di -> httpx",
    "docdoc.ingest.parsers.gcv -> google",
]
# The adapters arrive task by task; an ignore naming a module that does not
# exist yet is expected, not a misconfiguration.
unmatched_ignore_imports_alerting = "none"

# The same rule for the extraction layer, whose only adapter directory is
# docdoc.extraction.adapters. Listed separately from the ingest contract so that
# neither layer can accidentally inherit the other's exemptions.
[[tool.importlinter.contracts]]
name = "provider SDKs stay inside model adapters (Constitution Principle IV)"
type = "forbidden"
source_modules = ["docdoc.extraction"]
forbidden_modules = [
    "google",
    "httpx",
    "requests",
    "openai",
    "anthropic",
    "boto3",
    "fastapi",
    "sqlalchemy",
    "pymupdf",
    "fitz",
    "azure",
]
ignore_imports = [
    "docdoc.extraction.adapters.gemini -> google",
]
unmatched_ignore_imports_alerting = "none"
